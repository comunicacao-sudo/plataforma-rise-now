<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#082a24" />
    <title>Sem conexão | RISE NOW</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #082a24;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 460px;
        text-align: center;
      }
      img {
        width: 112px;
        height: 112px;
      }
      h1 {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 500;
      }
      p {
        color: #e6d6bd;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        border-radius: 28px;
        background: #d7b07a;
        color: #082a24;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icons/icon-192.png" width="112" height="112" alt="RISE NOW" />
      <h1>Vamos retomar sua jornada?</h1>
      <p>
        Você está sem conexão no momento. Conecte-se à internet para acessar suas aulas, agenda e
        atividades.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
