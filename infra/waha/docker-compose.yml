services:
  waha:
    image: devlikeapro/waha:gows
    container_name: rise-now-waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    environment:
      TZ: America/Sao_Paulo
      WAHA_API_KEY: "${WAHA_API_KEY_HASH:?Configure WAHA_API_KEY_HASH in a private env file}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME:?Configure WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD:?Configure WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_SWAGGER_USERNAME: "${WHATSAPP_SWAGGER_USERNAME:?Configure WHATSAPP_SWAGGER_USERNAME}"
      WHATSAPP_SWAGGER_PASSWORD: "${WHATSAPP_SWAGGER_PASSWORD:?Configure WHATSAPP_SWAGGER_PASSWORD}"
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_START_SESSION: rise-principal
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_AUTO_START_DELAY_SECONDS: "0"
      WAHA_PRINT_QR: "False"
      WAHA_WORKER_ID: rise-now
      WAHA_NAMESPACE: all
      WAHA_CLIENT_DEVICE_NAME: RISE NOW
      WAHA_CLIENT_BROWSER_NAME: Chrome
      WAHA_LOG_LEVEL: info
      WAHA_PUBLIC_URL: "${WAHA_PUBLIC_URL:?Configure the HTTPS WAHA public URL}"
      WHATSAPP_HOOK_URL: "${RISE_WEBHOOK_URL:?Configure the RISE NOW webhook URL}"
      WHATSAPP_HOOK_EVENTS: message.ack
      WHATSAPP_HOOK_HMAC_KEY: "${WAHA_WEBHOOK_HMAC_KEY:?Configure a webhook HMAC key}"
      WHATSAPP_HOOK_RETRIES_POLICY: exponential
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "5"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
    name: rise-now-waha-sessions
